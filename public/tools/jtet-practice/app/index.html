<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a47">
<title>JTET Paper II Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an exam-hall answer booklet. Cards are pages of the booklet; the question navigator is an OMR bubble sheet. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f6f8f5; --ink:#15211b; --muted:#5a6a61; --line:#d4ddd6;
  --accent:#1d6a47; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --mark:#b8761a; --mark-soft:#f6e8cf;
  --ok:#23824a; --ok-soft:#dcf0e2; --bad:#bf3b28; --bad-soft:#f8e0db;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-display:"Bricolage Grotesque","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201b; --surface-2:#1c2822; --ink:#e3ece6; --muted:#9aaba1; --line:#2c3b33;
  --accent:#5cc28c; --accent-ink:#0b1510; --accent-soft:#1f3a2c;
  --mark:#e2a54b; --mark-soft:#3a2d17;
  --ok:#5cc28c; --ok-soft:#183427; --bad:#ef7a66; --bad-soft:#3d1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --surface-2:#1c2822; --ink:#e3ece6; --muted:#9aaba1; --line:#2c3b33;
  --accent:#5cc28c; --accent-ink:#0b1510; --accent-soft:#1f3a2c;
  --mark:#e2a54b; --mark-soft:#3a2d17;
  --ok:#5cc28c; --ok-soft:#183427; --bad:#ef7a66; --bad-soft:#3d1f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.botnav{display:none}
@media (max-width:720px){
  .tabs{display:none}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .botnav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 2px}
  .botnav svg{width:20px;height:20px}
  main.app{padding-bottom:84px}
}
main.app{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:20px}
.card h3{font-size:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:0;padding:0;overflow:hidden}
.hero .l{padding:22px}
.hero .r{padding:22px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.hero h1{font-size:clamp(26px,4.4vw,38px);font-weight:800}
.hero .r .big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.hero .r .label{color:inherit;opacity:.8}
.hero .r .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);align-self:flex-start}
.pattern{display:grid;grid-template-columns:repeat(4,auto);gap:4px 14px;margin-top:14px;font-size:13.5px}
.pattern span:nth-child(even){font-family:var(--f-mono);font-weight:700}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--mark-soft);border:1px solid var(--mark);border-radius:var(--r);padding:12px 16px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile:hover{border-color:var(--accent)}
.tile .t{font-family:var(--f-display);font-weight:700;font-size:16.5px}
.tile .m{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.chip.weak{background:var(--bad-soft);color:var(--bad)}
.chip.fair{background:var(--mark-soft);color:var(--mark)}
.chip.strong{background:var(--ok-soft);color:var(--ok)}
.chip.new{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.kind{background:var(--accent-soft);color:var(--accent)}

/* tables / lists */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.topicrow{display:grid;grid-template-columns:1fr 110px 64px auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.topicrow:last-child{border-bottom:0}
@media (max-width:520px){.topicrow{grid-template-columns:1fr 64px auto}.topicrow .meter{display:none}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.hist:hover{background:var(--surface-2)}
.hist .sc{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:right}
.ring{width:46px;height:46px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* ---------- exam ---------- */
.exam{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.ebar{background:var(--surface);border-bottom:1px solid var(--line)}
.ebar .in{display:flex;align-items:center;gap:10px;min-height:54px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.etitle{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.timer{font-family:var(--f-mono);font-weight:700;font-size:18px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:9px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.secs{display:flex;gap:6px;overflow-x:auto;padding:0 max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));scrollbar-width:none}
.secs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.secs button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ebody{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.qpane{overflow-y:auto;padding:18px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px))}
.qcard{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-weight:800;font-size:22px}
.passage{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;max-height:220px;overflow:auto}
.qtext{font-size:17.5px;font-weight:500;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15.5px}
.opt:hover{border-color:var(--muted)}
.opt .bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14.5px}
.efoot{background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.efoot .in{max-width:1040px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.markbtn{border-color:var(--mark);color:var(--mark)}
.palette{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none;background:var(--surface)}
.bubbles{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:7px}
.b{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--muted);display:grid;place-items:center;padding:0}
.b.nv,.dot.nv{background:var(--surface);}
.b.na,.dot.na{border-color:var(--bad);color:var(--bad)}
.b.an,.dot.an{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.b.mk,.dot.mk{background:var(--mark);border-color:var(--mark);color:var(--surface)}
.b.am,.dot.am{background:var(--ok);border-color:var(--mark);box-shadow:0 0 0 2.5px var(--mark);color:var(--surface)}
.b.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.b.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.b.cur{outline:2px solid var(--ink);outline-offset:2px}
.pal-sec{font-size:12px;font-weight:700;color:var(--ink);margin-top:4px}
.pal-close{display:none}
@media (max-width:860px){
  .ebody{grid-template-columns:1fr}
  .palette{position:fixed;inset:auto 0 0 0;max-height:72%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:40;transform:translateY(105%);transition:transform .2s ease;
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .palette.open{transform:none}
  .pal-close{display:inline-flex}
}
@media (min-width:861px){.pal-toggle{display:none}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,20,15,.45);padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal h3{font-size:19px}

/* result */
.scorebig{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,9vw,72px);line-height:1}
.passbar{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:visible}
.passbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.passbar .line{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.passbar .lt{position:absolute;top:18px;font-size:11.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.rev{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rev:last-child{border-bottom:0}
.rev .ans{font-size:14px;display:flex;flex-direction:column;gap:3px}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.syl li{margin:3px 0}
.syl ul{margin:6px 0 0;padding-left:18px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>

<div id="root"></div>

<script src="q_cdp.js"></script>
<script src="q_eng.js"></script>
<script src="q_mun.js"></script>
<script src="q_ss.js"></script>
<script>
(function(){
"use strict";
var QB = window.QB || {};
var SECS = [
  {k:"cdp", name:"Child Development & Pedagogy", short:"CDP", n:30},
  {k:"eng", name:"Language I · English", short:"English", n:30},
  {k:"mun", name:"Language II · Mundari", short:"Mundari", n:30},
  {k:"ss",  name:"Social Science", short:"Social Sc.", n:60}
];
var SEC = {}; SECS.forEach(function(s){ SEC[s.k]=s; });
var PASS = 60; // general-category benchmark (%)

// ---------- question index ----------
var Q = {}, BYSEC = {};
SECS.forEach(function(s){
  BYSEC[s.k] = [];
  (QB[s.k]||[]).forEach(function(r,i){
    var id = s.k+"-"+i;
    Q[id] = {id:id, sec:s.k, topic:r[0], text:r[1], opts:r[2], ans:r[3], ex:r[4]||"", pas:r[5]||null};
    BYSEC[s.k].push(id);
  });
});
var TOTALQ = Object.keys(Q).length;

// ---------- storage ----------
var KEY = "jtet2.practice.v1";
var S = {attempts:[], qs:{}, active:null};
try { var raw = localStorage.getItem(KEY); if(raw){ var p = JSON.parse(raw); if(p && typeof p==="object"){ S.attempts=p.attempts||[]; S.qs=p.qs||{}; S.active=p.active||null; } } } catch(e){}
var storageOK = true;
var lastJSON = JSON.stringify(S);
function save(){
  var j = JSON.stringify(S), changed = j!==lastJSON; lastJSON = j;
  if(changed){ SY.updated = Date.now(); saveSync(); queuePush(); }
  try{ localStorage.setItem(KEY, j); storageOK=true; }catch(e){ storageOK=false; }
}

// ---------- online sync (test-series.klabs.in) ----------
var API = "https://test-series.klabs.in/api";
var SKEY = "jtet2.sync.v1";
var SY = {id:"", name:"", updated:0}, syncStatus = "";
try { var sr = JSON.parse(localStorage.getItem(SKEY)||"null"); if(sr && sr.id) SY = {id:sr.id, name:sr.name||"", updated:sr.updated||0}; } catch(e){}
if(!SY.id){ var rb = new Uint8Array(16); (window.crypto||window.msCrypto).getRandomValues(rb); SY.id = Array.prototype.map.call(rb,function(b){ return ("0"+b.toString(16)).slice(-2); }).join(""); saveSync(); }
function saveSync(){ try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){} }
var pushT = null;
function queuePush(){ if(!SY.name || pushT) return; pushT = setTimeout(function(){ pushT=null; push(); }, 4000); }
function setStatus(s){ syncStatus=s; var el=document.getElementById("syncstat"); if(el) el.textContent=s; }
function push(){
  if(!SY.name) return;
  var body = JSON.stringify({id:SY.id, name:SY.name, state:S, updated:SY.updated});
  // text/plain keeps this a simple CORS request (no preflight); keepalive lets it finish on page close.
  return fetch(API+"/sync", {method:"POST", headers:{"Content-Type":"text/plain"}, body:body, keepalive: body.length<60000})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ setStatus("Saved online"); if(d.stale) pull(false); })
    .catch(function(){ setStatus("Offline, will retry"); });
}
function pull(force){
  return fetch(API+"/state/"+SY.id, {cache:"no-store"}).then(function(r){
    if(r.status===404) return null; if(!r.ok) throw 0; return r.json();
  }).then(function(d){
    if(!d){ if(force) throw "nf"; if(SY.name) push(); return false; }
    if(!SY.name) SY.name = d.name;
    if(force || d.updated > SY.updated){
      var p = d.state||{}; S = {attempts:p.attempts||[], qs:p.qs||{}, active:p.active||null};
      lastJSON = JSON.stringify(S); SY.updated = d.updated; SY.name = d.name;
      try{ localStorage.setItem(KEY, lastJSON); }catch(e){}
      saveSync(); setStatus("Saved online");
      if(view.name!=="exam") render();
      return true;
    }
    saveSync(); setStatus("Saved online");
    if(d.updated < SY.updated) push();
    return false;
  }).catch(function(e){ if(e!=="nf") setStatus("Offline, will retry"); if(force) throw e; });
}
function renderSync(){

// ---------- helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(s){ s=Math.max(0,Math.round(s)); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h? h+":"+String(m).padStart(2,"0") : String(m)) + ":" + String(x).padStart(2,"0"); }
function fmtDur(s){ s=Math.round(s); var h=Math.floor(s/3600), m=Math.round(s%3600/60); if(h) return h+"h "+m+"m"; return Math.max(1,Math.round(s/60))+" min"; }
function fmtDate(t){ var d=new Date(t); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); }
function pct(c,t){ return t? Math.round(c*100/t) : 0; }
function level(acc, n){ if(!n) return ["new","Not started"]; if(n<3) return ["new","Few tries"]; if(acc<60) return ["weak","Weak"]; if(acc<80) return ["fair","Fair"]; return ["strong","Strong"]; }
var $root = document.getElementById("root");

// topic stats from per-question stats
function topicStats(){
  var T = {};
  Object.keys(Q).forEach(function(id){
    var q=Q[id], key=q.sec+"|"+q.topic;
    if(!T[key]) T[key]={sec:q.sec, topic:q.topic, bank:0, seen:0, a:0, c:0};
    T[key].bank++;
    var st=S.qs[id]; if(st){ T[key].seen++; T[key].a+=st.a; T[key].c+=st.c; }
  });
  return Object.keys(T).map(function(k){ var t=T[k]; t.acc=pct(t.c,t.a); return t; });
}
function secStats(){
  var R={}; SECS.forEach(function(s){ R[s.k]={a:0,c:0,seen:0}; });
  Object.keys(S.qs).forEach(function(id){ var q=Q[id]; if(!q) return; var st=S.qs[id]; R[q.sec].a+=st.a; R[q.sec].c+=st.c; R[q.sec].seen++; });
  return R;
}
function weakTopics(){ return topicStats().filter(function(t){ return t.a>=3 && t.acc<60; }).sort(function(a,b){ return a.acc-b.acc; }); }
function mistakeIds(){ return Object.keys(S.qs).filter(function(id){ return Q[id] && S.qs[id].last===0; }); }

// ---------- question selection ----------
function pick(sec, n, filter){
  var pool = BYSEC[sec].filter(filter||function(){return true;});
  pool = shuffle(pool).sort(function(a,b){ return ((S.qs[a]||{}).a||0) - ((S.qs[b]||{}).a||0); }); // least-practised first
  var chosen = pool.slice(0, n);
  // keep comprehension passages together, rest random
  var withP = chosen.filter(function(id){return Q[id].pas;}).sort(function(a,b){return Q[a].pas<Q[b].pas?-1:1;});
  var noP = chosen.filter(function(id){return !Q[id].pas;});
  return withP.concat(noP);
}
function weakPick(n){
  var ts={}; topicStats().forEach(function(t){ ts[t.sec+"|"+t.topic]=t; });
  var scored = Object.keys(Q).map(function(id){
    var q=Q[id], st=S.qs[id], t=ts[q.sec+"|"+q.topic], s=Math.random()*0.6;
    if(st && st.last===0) s+=3;
    if(t && t.a>=2) s+= (100-t.acc)/40;
    if(!st) s+=0.4;
    return [id,s];
  }).sort(function(a,b){return b[1]-a[1];});
  return scored.slice(0,n).map(function(x){return x[0];});
}

// ---------- test lifecycle ----------
function newTest(o){
  var t = {id:"t"+Date.now(), kind:o.kind, title:o.title, mode:o.mode||"exam", dur:o.dur||0, qids:o.qids, secs:[],
           ans:{}, marked:{}, visited:{}, cur:0, elapsed:0, started:Date.now(), checked:{}};
  o.qids.forEach(function(id){ var s=Q[id].sec; if(t.secs.indexOf(s)<0) t.secs.push(s); });
  if(!t.qids.length){ toast("No questions available for this selection yet."); return; }
  S.active = t; save(); go("exam");
}
var START = {
  mock: function(){ var ids=[]; SECS.forEach(function(s){ ids=ids.concat(pick(s.k,s.n)); }); newTest({kind:"Full mock",title:"Full mock test",qids:ids,dur:150*60}); tryFull(); },
  mini: function(){ var ids=[]; SECS.forEach(function(s){ ids=ids.concat(pick(s.k, s.k==="ss"?20:10)); }); newTest({kind:"Mini mock",title:"Mini mock test",qids:ids,dur:50*60}); },
  section: function(k){ var s=SEC[k]; var ids=pick(k,s.n); newTest({kind:"Sectional",title:s.name,qids:ids,dur:ids.length*60}); },
  topic: function(k,topic){ var ids=shuffle(BYSEC[k].filter(function(id){return Q[id].topic===topic;})); newTest({kind:"Topic practice",title:topic,qids:ids,mode:"practice"}); },
  weak: function(){ newTest({kind:"Weak-area drill",title:"Weak-area drill",qids:weakPick(25),mode:"practice"}); },
  mistakes: function(){ var ids=shuffle(mistakeIds()).slice(0,40); newTest({kind:"Mistake replay",title:"Mistake replay",qids:ids,mode:"practice"}); }
};

function finish(){
  var t=S.active; if(!t) return;
  stopTick();
  var secs={}, topics={}, score=0, items=[];
  t.qids.forEach(function(id){
    var q=Q[id], a=t.ans[id], ok = (a===q.ans);
    if(!secs[q.sec]) secs[q.sec]={c:0,t:0,att:0};
    secs[q.sec].t++; if(a!=null) secs[q.sec].att++; if(ok){ secs[q.sec].c++; score++; }
    var tk=q.sec+"|"+q.topic; if(!topics[tk]) topics[tk]={c:0,t:0}; topics[tk].t++; if(ok) topics[tk].c++;
    items.push([id, a==null?-1:a]);
    if(a!=null || t.mode==="exam"){ // unanswered in an exam still counts as a miss for revision
      var st=S.qs[id]||{a:0,c:0,last:0}; st.a++; if(ok) st.c++; st.last= ok?1:0; S.qs[id]=st;
    }
  });
  var rec={id:t.id, kind:t.kind, title:t.title, mode:t.mode, date:Date.now(), dur:t.dur, used:t.elapsed, total:t.qids.length, score:score, secs:secs, topics:topics, items:items};
  S.attempts.unshift(rec); if(S.attempts.length>300) S.attempts.length=300;
  S.active=null; save();
  exitFull();
  view.result=rec.id; go("result");
}

function trendChart(){
  var pts = S.attempts.filter(function(a){return a.kind==="Full mock"||a.kind==="Mini mock";}).slice(0,20).reverse();
  if(pts.length<1) return '<div class="empty">Take a full or mini mock to start your score trend.</div>';
  var W=640,H=200,L=34,R=12,T=12,B=26, iw=W-L-R, ih=H-T-B;
  function x(i){ return L + (pts.length===1? iw/2 : i*iw/(pts.length-1)); }
  function y(v){ return T + ih - v/100*ih; }
  var g=""; [0,25,50,75,100].forEach(function(v){ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'; });
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(PASS)+'" y2="'+y(PASS)+'" stroke="var(--mark)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  var d=pts.map(function(a,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(pct(a.score,a.total)).toFixed(1); }).join(" ");
  var area = d+" L"+x(pts.length-1).toFixed(1)+" "+y(0)+" L"+x(0).toFixed(1)+" "+y(0)+" Z";

// ---------- EXAM ----------
function status(t,id){ var a=t.ans[id]!=null, m=!!t.marked[id];
  if(a&&m) return "am"; if(m) return "mk"; if(a) return "an"; if(t.visited[id]) return "na"; return "nv"; }
function renderExam(){
  var t=S.active; if(!t){ view.name="home"; return shell(renderHome()); }

      return '<button data-jsec="'+s+'" aria-current="'+(s===secOf)+'">'+SEC[s].short+' <span class="num">'+done+'/'+ids.length+'</span></button>'; }).join("")+'</div>' : '';
  var timeTxt = t.dur? fmtTime(t.dur-t.elapsed) : fmtTime(t.elapsed);

    '<button class="icon-btn pal-toggle" data-act="pal" title="Question palette" aria-label="Question palette">'+ICON.grid+'</button>'+
    '<button class="btn primary sm" data-act="submit">'+(practice?'Finish':'Submit')+'</button></div>'+tabs+'</div>';
  var opts=q.opts.map(function(o,i){

    return '<button class="opt'+cls+'" role="radio" aria-checked="'+(sel&&!checked)+'" data-opt="'+i+'"'+(checked?' disabled':'')+'><span class="bub">'+String.fromCharCode(65+i)+'</span><span>'+esc(o)+'</span></button>';
  }).join("");
  var fb = checked ? '<div class="explain"><b class="'+(t.ans[id]===q.ans?'ok':'bad')+'">'+(t.ans[id]===q.ans?'Correct.':'Not quite. The answer is '+String.fromCharCode(65+q.ans)+'.')+'</b> '+esc(q.ex)+'</div>' : '';
  var qcard='<div class="qcard"><div class="qhead"><span class="qno num">Q'+(t.cur+1)+'</span><span class="muted num">of '+t.qids.length+'</span><span class="chip kind">'+SEC[q.sec].short+'</span><span class="muted" style="font-size:12.5px">'+esc(q.topic)+'</span>'+(t.marked[id]?'<span class="chip fair">Marked</span>':'')+'</div>'+
    (q.pas? '<div class="passage">'+esc(QB.passages[q.pas]||"")+'</div>':'')+
    '<div class="qtext">'+esc(q.text)+'</div><div class="opts" role="radiogroup">'+opts+'</div>'+fb+'</div>';
  var last = t.cur===t.qids.length-1;

    ? '<div class="efoot"><div class="in"><button class="btn" data-act="prev"'+(t.cur?'':' disabled')+'>Previous</button><span class="spacer"></span>'+(last? '<button class="btn primary" data-act="submit">Finish & see score</button>' : '<button class="btn primary" data-act="next">Next</button>')+'</div></div>'
    : '<div class="efoot"><div class="in"><button class="btn" data-act="prev"'+(t.cur?'':' disabled')+'>Previous</button><button class="btn markbtn" data-act="mark">'+(t.marked[id]?'Unmark':'Mark & next')+'</button><button class="btn ghost" data-act="clearans"'+(t.ans[id]!=null?'':' disabled')+'>Clear</button><span class="spacer"></span><button class="btn primary" data-act="next">'+(last?'Save':'Save & next')+'</button></div></div>';

// ---------- events ----------
document.addEventListener("click", function(e){
  var el=e.target.closest("button,[data-act]"); if(!el) return;

  if(d.jump!=null && t){ move(+d.jump); return; }
  if(d.jsec && t){ for(var i=0;i<t.qids.length;i++){ if(Q[t.qids[i]].sec===d.jsec){ move(i); return; } } }
  switch(d.act){

    case "mini": if(S.active) return ask({title:"Replace the test in progress?",body:"You have an unfinished test. Starting a new one discards it.",yes:"Start new",danger:true,run:START.mini}); START.mini(); break;
    case "weak": START.weak(); break;
    case "mistakes": START.mistakes(); break;
    case "resume": go("exam"); break;
    case "discard": ask({title:"Discard this test?",body:"Your answers in the unfinished test will be lost. Nothing is added to history.",yes:"Discard",danger:true,run:function(){ S.active=null; save(); render(); }}); break;
    case "pause": save(); exitFull(); go("home"); toast("Test saved. Resume it from Home."); break;
    case "full": toggleFull(); break;
    case "pal": view.pal=!view.pal; render(); break;
    case "prev": move(t.cur-1); break;
    case "next": if(t.cur<t.qids.length-1) move(t.cur+1); else { save(); view.pal=true; render(); toast("Last question. Check the palette, then submit."); } break;
    case "mark": var mid=t.qids[t.cur]; if(t.marked[mid]) { delete t.marked[mid]; save(); render(); } else { t.marked[mid]=true; if(t.cur<t.qids.length-1) move(t.cur+1); else { save(); render(); } } break;

    case "review": go("review"); break;
    case "toresult": go("result"); break;
    case "clear": ask({title:"Clear all saved data?",body:"This deletes your test history, topic accuracy and any test in progress from this browser"+(SY.name?" and your online copy":"")+". It cannot be undone.",yes:"Clear everything",danger:true,run:function(){ S={attempts:[],qs:{},active:null}; save(); go("home"); }}); break;
    case "copycode": (navigator.clipboard? navigator.clipboard.writeText(SY.id) : Promise.reject()).then(function(){ toast("Code copied."); }, function(){ toast("Your code: "+SY.id); }); break;
    case "restore": ask({title:"Continue from another device", body:'Enter the code shown on your other device. Progress on this device will be replaced with the saved progress.<input id="rcode" placeholder="Your code" autocomplete="off" style="display:block;width:100%;margin-top:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit">', yes:"Load progress", run:function(){
      var code=((document.getElementById("rcode")||{}).value||"").trim().toLowerCase(), old={id:SY.id,name:SY.name,updated:SY.updated};
      render();
      if(!/^[a-z0-9_-]{16,64}$/.test(code)){ toast("That code doesn't look right."); return; }
      SY.id=code; SY.name=""; pull(true).then(function(){ toast("Progress loaded. Welcome back, "+SY.name+"."); render(); }, function(e){ SY=old; saveSync(); toast(e==="nf" ? "No saved progress found for that code." : "Couldn't reach the server. Try again in a moment."); });
    }}); break;
    case "cno": view.confirm=null; render(); if(view.name==="exam") startTick(); break;
    case "cyes": var c=view.confirm; view.confirm=null; if(c&&c.run) c.run(); else render(); break;
  }
});
document.addEventListener("keydown", function(e){
  if(view.name!=="exam"||view.confirm||!S.active) return;
  var k=e.key.toLowerCase(), m={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}, t=S.active;
  if(k in m){ var id=t.qids[t.cur]; if(t.mode==="practice"&&t.ans[id]!=null) return; t.ans[id]=m[k]; save(); render(); }
  else if(e.key==="ArrowRight"){ if(t.cur<t.qids.length-1) move(t.cur+1); }
  else if(e.key==="ArrowLeft"){ move(t.cur-1); }
});
document.addEventListener("submit", function(e){
  if(e.target.dataset.form!=="sync") return; e.preventDefault();
  var n=document.getElementById("syncname").value.trim().slice(0,60); if(!n) return;
  SY.name=n; if(!SY.updated) SY.updated=Date.now(); saveSync(); setStatus("Saving…"); render();
  push().then(function(){ toast("Your progress is now saved online."); });
});
function flush(){ save(); if(pushT){ clearTimeout(pushT); pushT=null; push(); } }
window.addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", function(){ if(document.hidden) flush(); });

render();
if(SY.name){ setStatus("Checking…"); pull(false); }
})();
</script>

</body>
